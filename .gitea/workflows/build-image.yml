name: build-image
on:
  workflow_dispatch:
jobs:
  image:
    runs-on: linux-docker-privileged
    steps:
      - uses: actions/checkout@v4
      - name: Check runner capacity
        run: |
          test "$(awk '/MemTotal/ {print int($2/1024/1024)}' /proc/meminfo)" -ge 8
          test "$(df -BG --output=avail . | tail -1 | tr -dc '0-9')" -ge 50
          docker info >/dev/null
      - name: Install administrator SSH keys
        env:
          ADSB_ADMIN_AUTHORIZED_KEYS: ${{ secrets.ADSB_ADMIN_AUTHORIZED_KEYS }}
        run: |
          test -n "$ADSB_ADMIN_AUTHORIZED_KEYS"
          umask 077
          printf '%s\n' "$ADSB_ADMIN_AUTHORIZED_KEYS" > config/authorized_keys
      - name: Build as an unprivileged user
        run: |
          test -S /var/run/docker.sock
          useradd --create-home --shell /bin/bash builder
          docker_socket_gid="$(stat -c '%g' /var/run/docker.sock)"
          docker_socket_group="$(getent group "$docker_socket_gid" | cut -d: -f1)"
          if [ -z "$docker_socket_group" ]; then
            docker_socket_group=docker-socket
            groupadd --gid "$docker_socket_gid" "$docker_socket_group"
          fi
          usermod --append --groups "$docker_socket_group" builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- bash -lc 'cd "$GITHUB_WORKSPACE" && ./build.sh'
      - uses: actions/upload-artifact@v4
        with: {name: adsb-receiver-images, path: dist/*/*}
