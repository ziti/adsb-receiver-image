name: validate
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck jq
      - run: shellcheck build.sh userpatches/customize-image.sh examples/config-server/scripts/sign-config.sh
      - run: bash -n build.sh userpatches/customize-image.sh examples/config-server/scripts/sign-config.sh
      - run: python3 -m unittest discover -s tests -v
      - run: jq empty config/build.json config/targets.json schemas/receiver-config.schema.json examples/config-server/config/default.json
      - run: '! git grep -nE "BEGIN (RSA|OPENSSH|EC|PRIVATE) KEY|RW[QR][A-Za-z0-9+/=]{40,}" -- . ":!userpatches/overlay/etc/adsb-receiver/publickey.minisign"'
