name: Build image

on:
  workflow_dispatch:
    inputs:
      image_version:
        description: Release and image version, for example 2026.08.20.1
        required: true
        default: 2026.08.20.1
        type: string

permissions:
  contents: write

env:
  # Exact Armbian action/framework revision. Its VERSION file reports
  # 26.08.0-trunk; the commit is the authoritative identifier.
  ARMBIAN_ACTION_REVISION: 0620eb67885d19aeabd62655e60870ffd1efad63

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Keep this explicit until more targets exist. Each enabled target can
        # become one include entry without changing the build architecture.
        include:
          - target: orangepi-zero3
            board: orangepizero3
            architecture: arm64
            release: trixie
            kernel_branch: current
    env:
      ADSB_IMAGE_VERSION: ${{ inputs.image_version }}
      ADSB_GIT_COMMIT: ${{ github.sha }}
      ADSB_ARMBIAN_REVISION: 0620eb67885d19aeabd62655e60870ffd1efad63
      ADSB_TARGET: ${{ matrix.target }}
      ADSB_TARGET_ARCH: ${{ matrix.architecture }}
      # This is deliberately a repository secret. Only public SSH keys are
      # written into the image; the workflow never logs their value.
      ADSB_ADMIN_AUTHORIZED_KEYS: ${{ secrets.ADSB_ADMIN_AUTHORIZED_KEYS }}

    steps:
      - name: Check out source for metadata
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.11'

      - name: Validate the selected target
        run: |
          python -m pip install 'jsonschema==4.25.1'
          python scripts/validate_repository.py --production --target "${{ matrix.target }}"
          test -n "$ADSB_ADMIN_AUTHORIZED_KEYS" || {
            echo 'Missing required ADSB_ADMIN_AUTHORIZED_KEYS repository secret.' >&2
            exit 1
          }

      - name: Load build configuration
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          from pathlib import Path

          build = json.loads(Path("config/build.json").read_text())
          target = json.loads(Path("config/targets.json").read_text())["targets"]["${{ matrix.target }}"]
          print(f"ADSB_READSB_REVISION={build['readsb']['revision']}")
          print(f"ADSB_CONFIG_URL_TEMPLATE={build['defaults']['configUrlTemplate']}")
          print(f"ADSB_KERNEL_REVISION={target['armbian']['kernelRevision']}")
          PY

      - name: Build and release with Armbian
        uses: armbian/build@0620eb67885d19aeabd62655e60870ffd1efad63 # exact framework/action revision
        with:
          armbian_token: ${{ github.token }}
          armbian_branch: 0620eb67885d19aeabd62655e60870ffd1efad63
          armbian_board: ${{ matrix.board }}
          armbian_kernel_branch: ${{ matrix.kernel_branch }}
          armbian_release: ${{ matrix.release }}
          armbian_target: build
          armbian_ui: minimal
          armbian_compress: sha,img,xz
          armbian_extensions: adsb-kernel-pin
          armbian_release_tag: ${{ inputs.image_version }}
          armbian_release_title: ADS-B receiver image ${{ inputs.image_version }}
          armbian_release_body: |
            Reproducible minimal Armbian-based ADS-B receiver image.
            Target: ${{ matrix.target }} (${{ matrix.board }}, ${{ matrix.architecture }}).
            Framework/action revision: 0620eb67885d19aeabd62655e60870ffd1efad63.
          armbian_runner_clean: yes
          armbian_download_repository: ''
          armbian_index_url: ''

      - name: Assemble reproducibility metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          metadata_dir="build/output/adsb-metadata/${{ matrix.target }}"
          mkdir -p "$metadata_dir"
          cp config/build.json config/targets.json "$metadata_dir/"
          if [[ -d build/output/info ]]; then
            mkdir -p "$metadata_dir/armbian-info"
            cp -a build/output/info/. "$metadata_dir/armbian-info/"
          fi
          if [[ -s "$metadata_dir/armbian-info/git_sources.json" ]]; then
            git_sources_metadata=present
          else
            git_sources_metadata=not-generated-by-image-build
          fi
          sha256sum build/output/images/*.img.xz > "$metadata_dir/image-sha256sums.txt"
          GIT_SOURCES_METADATA="$git_sources_metadata" python - "$metadata_dir/build-manifest.json" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          build = json.loads(Path("config/build.json").read_text())
          targets = json.loads(Path("config/targets.json").read_text())
          target_name = os.environ["ADSB_TARGET"]
          manifest = {
              "repositoryCommit": os.environ["ADSB_GIT_COMMIT"],
              "imageVersion": os.environ["ADSB_IMAGE_VERSION"],
              "target": {"id": target_name, **targets["targets"][target_name]},
              "debianRelease": build["armbian"]["release"],
              "readsb": build["readsb"],
              "armbian": {
                  "actionRevision": os.environ["ARMBIAN_ACTION_REVISION"],
                  "frameworkRevision": os.environ["ADSB_ARMBIAN_REVISION"],
                  "versionFile": "26.08.0-trunk",
                  "kernelBranchClass": "current",
                  "kernelRevision": os.environ["ADSB_KERNEL_REVISION"],
                  "gitSourcesMetadata": os.environ["GIT_SOURCES_METADATA"],
              },
          }
          Path(sys.argv[1]).write_text(json.dumps(manifest, indent=2) + "\n")
          PY

      - name: Upload image, checksum, and reproducibility metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: adsb-receiver-${{ matrix.target }}-${{ inputs.image_version }}
          if-no-files-found: error
          path: |
            build/output/images/*.img.xz
            build/output/images/*.sha
            build/output/adsb-metadata/${{ matrix.target }}/
