name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.11'

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends jq shellcheck
          python -m pip install 'jsonschema==4.25.1'

      - name: Validate repository contracts
        run: python scripts/validate_repository.py

      - name: Check shell scripts
        run: |
          bash -n build.sh userpatches/customize-image.sh examples/config-server/scripts/sign-config.sh
          shellcheck build.sh userpatches/customize-image.sh examples/config-server/scripts/sign-config.sh

      - name: Run configuration-agent tests
        run: python -m unittest discover -s tests -v
