name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.11'

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends dosfstools jq shellcheck
          python -m pip install 'jsonschema==4.25.1'

      - name: Validate repository contracts
        run: python scripts/validate_repository.py

      - name: Check shell scripts
        run: |
          bash -n build.sh scripts/validate-bootstrap-partition.sh userpatches/customize-image.sh userpatches/extensions/adsb-bootstrap-partition.sh userpatches/extensions/adsb-kernel-pin.sh userpatches/overlay/etc/adsb-receiver/build-inputs.sh
          shellcheck build.sh scripts/validate-bootstrap-partition.sh userpatches/customize-image.sh userpatches/extensions/adsb-bootstrap-partition.sh userpatches/extensions/adsb-kernel-pin.sh userpatches/overlay/etc/adsb-receiver/build-inputs.sh

      - name: Validate raw ADSB-BOOT formatter without loop partition mappings
        run: scripts/validate-bootstrap-partition.sh

      - name: Run appliance configuration tests
        run: python -m unittest discover -s tests -v

      - name: Compile appliance Python
        run: |
          python -m py_compile \
            scripts/validate_repository.py \
            userpatches/overlay/usr/local/sbin/adsb-config \
            userpatches/overlay/usr/local/sbin/adsb-network-mode \
            userpatches/overlay/usr/local/sbin/adsb-json-server \
            userpatches/overlay/usr/local/sbin/adsb-admin-server
