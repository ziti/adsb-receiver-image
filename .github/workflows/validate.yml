name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends jq shellcheck
          python3 -m pip install --user 'jsonschema==4.25.1'

      - name: Validate repository contracts
        run: python3 scripts/validate_repository.py

      - name: Check shell scripts
        run: |
          bash -n build.sh userpatches/customize-image.sh examples/config-server/scripts/sign-config.sh
          shellcheck build.sh userpatches/customize-image.sh examples/config-server/scripts/sign-config.sh

      - name: Run configuration-agent tests
        run: python3 -m unittest discover -s tests -v

      - name: Check systemd unit syntax
        run: |
          systemd-analyze verify --root="$PWD/userpatches/overlay" \
            /etc/systemd/system/*.service /etc/systemd/system/*.timer
